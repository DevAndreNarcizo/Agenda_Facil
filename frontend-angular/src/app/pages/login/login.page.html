<af-auth-shell lead="Sua agenda, clientes e reservas em um só lugar.">
  <nav class="tabs" aria-label="Acesso">
    <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Entrar</a>
    <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Criar conta</a>
  </nav>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Entrar na sua conta</h1>

    <label>
      E-mail
      <span class="input-wrap">
        <af-icon name="mail" />
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@negocio.com" />
      </span>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Informe um e-mail válido.</span>
      }
    </label>

    <label>
      Senha
      <span class="input-wrap">
        <af-icon name="lock" />
        <input type="password" formControlName="password" autocomplete="current-password" />
      </span>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">A senha deve ter ao menos 8 caracteres.</span>
      }
    </label>

    @if (error()) {
      <div class="alert alert-bad" role="alert"><af-icon name="error" [size]="18" />{{ error() }}</div>
    }

    <button type="submit" class="btn-primary btn-lg" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</af-auth-shell>

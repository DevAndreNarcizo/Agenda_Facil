<section class="auth">
  <h1>Entrar — Agenda Fácil</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Informe um e-mail válido.</small>
    }

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">A senha deve ter ao menos 8 caracteres.</small>
    }

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p>Não tem conta? <a routerLink="/register">Cadastre-se</a></p>
</section>

<af-auth-shell lead="Crie sua conta e comece a agendar. Teste grátis, sem cartão.">
  <nav class="tabs" aria-label="Acesso">
    <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Entrar</a>
    <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Criar conta</a>
  </nav>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Criar sua conta</h1>

    <label>
      Seu nome
      <span class="input-wrap"><af-icon name="person" /><input type="text" formControlName="full_name" autocomplete="name" /></span>
    </label>

    <label>
      E-mail
      <span class="input-wrap"><af-icon name="mail" /><input type="email" formControlName="email" autocomplete="email" /></span>
    </label>

    <label>
      Senha
      <span class="input-wrap"><af-icon name="lock" /><input type="password" formControlName="password" autocomplete="new-password" /></span>
      <span class="muted">Mínimo de 8 caracteres.</span>
    </label>

    <label>
      Nome do negócio
      <span class="input-wrap"><af-icon name="storefront" /><input type="text" formControlName="org_name" /></span>
    </label>

    <label>
      Link (slug)
      <span class="input-wrap"><af-icon name="link" /><input type="text" formControlName="org_slug" placeholder="meu-salao" /></span>
      @if (form.controls.org_slug.touched && form.controls.org_slug.invalid) {
        <span class="field-error">Use apenas letras minúsculas, números e hífens.</span>
      } @else {
        <span class="muted">Seu link de reservas: /reservar/{{ form.controls.org_slug.value || 'meu-salao' }}</span>
      }
    </label>

    @if (error()) {
      <div class="alert alert-bad" role="alert"><af-icon name="error" [size]="18" />{{ error() }}</div>
    }

    <button type="submit" class="btn-primary btn-lg" [disabled]="submitting()">
      {{ submitting() ? 'Criando…' : 'Criar conta' }}
    </button>
  </form>
</af-auth-shell>

<section class="auth">
  <h1>Criar conta — Agenda Fácil</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>Seu nome<input type="text" formControlName="full_name" /></label>
    <label>E-mail<input type="email" formControlName="email" autocomplete="email" /></label>
    <label>Senha<input type="password" formControlName="password" autocomplete="new-password" /></label>
    <label>Nome do negócio<input type="text" formControlName="org_name" /></label>
    <label>
      Link (slug)
      <input type="text" formControlName="org_slug" placeholder="meu-salao" />
    </label>
    @if (form.controls.org_slug.touched && form.controls.org_slug.invalid) {
      <small class="field-error">Use apenas letras minúsculas, números e hífens.</small>
    }

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Criando…' : 'Criar conta' }}
    </button>
  </form>

  <p>Já tem conta? <a routerLink="/login">Entrar</a></p>
</section>

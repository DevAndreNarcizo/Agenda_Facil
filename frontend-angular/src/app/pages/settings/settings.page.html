<div class="page">
  <header class="page-header">
    <div><span class="eyebrow">Conta</span><h1>Configurações</h1></div>
  </header>

  @if (auth.isManager()) {
    <section class="panel">
      <div class="panel-header"><h2>Identidade do negócio</h2></div>
      <form class="panel-body narrow" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <label>Nome do negócio<input type="text" formControlName="name" /></label>
        <label>
          Cor da marca
          <span class="color-row">
            <input type="color" formControlName="primary_color" aria-label="Escolher cor" />
            <input type="text" formControlName="primary_color" aria-label="Código hexadecimal da cor" />
            <span class="color-preview" [style.background]="form.controls.primary_color.value"></span>
          </span>
          @if (form.controls.primary_color.touched && form.controls.primary_color.invalid) {
            <span class="field-error">Use um hex válido, ex.: #087bf5.</span>
          }
        </label>

        @if (message()) { <div class="message" role="status">{{ message() }}</div> }
        @if (error()) { <div class="error" role="alert">{{ error() }}</div> }

        <div><button type="submit" class="btn-primary" [disabled]="saving()">{{ saving() ? 'Salvando…' : 'Salvar alterações' }}</button></div>
      </form>
    </section>
  } @else {
    <div class="alert alert-warn">Apenas gestores podem alterar as configurações.</div>
  }
</div>

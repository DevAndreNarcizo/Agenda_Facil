# Ambiente de desenvolvimento do SaaS Agenda Fácil.
# PostgreSQL é a fonte autoritativa dos dados. Nada aqui toca produção/Supabase.
#
# Uso:
#   docker compose up -d db
#   (backend) cd backend && cp .env.example .env && php artisan key:generate && php artisan migrate --seed
#
# Observação: neste sandbox de avaliação o runtime de containers não está disponível;
# este arquivo é o setup entregue para ambientes reais (dev/staging).

services:
  db:
    image: postgres:18-alpine
    container_name: agenda_facil_db
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda_dev
      POSTGRES_DB: agenda_facil
    ports:
      - "5433:5432"
    volumes:
      - agenda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda_facil"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage privado compatível com S3 para arquivos (logos, anexos).
  minio:
    image: minio/minio:latest
    container_name: agenda_facil_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agenda
      MINIO_ROOT_PASSWORD: agenda_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agenda_minio_data:/data

  backend:
    image: php:8.4-cli
    container_name: agenda_facil_backend
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: agenda_facil
      DB_USERNAME: agenda
      DB_PASSWORD: agenda_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  agenda_pg_data:
  agenda_minio_data:
